<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#e7f0df" />
  <meta name="description" content="MY GARDEN — عالمك الطبيعي الذي ينمو معك." />
  <title>MY GARDEN | حديقتي</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js",
        "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js"
      }
    }
  </script>
</head>
<body>
  <main id="app">
    <canvas id="world" aria-label="عالم الحديقة ثلاثي الأبعاد"></canvas>

    <header class="topbar">
      <div class="brand-lockup">
        <span class="brand-mark" aria-hidden="true">✿</span>
        <div>
          <div class="brand-name">MY GARDEN</div>
          <div class="brand-subtitle">حديقتك، على مهل</div>
        </div>
      </div>
      <div class="top-actions">
        <span id="save-status" class="save-status"><i></i> محفوظ</span>
        <button id="settings-button" class="glass-button" type="button">الإعدادات</button>
      </div>
    </header>

    <div class="world-hint" id="world-hint">تحرّك بحرية واستكشف المكان</div>

    <div class="bottom-dock" id="bottom-dock">
      <button class="dock-button" id="tasks-button" type="button">
        <span class="dock-symbol">☀</span><span>المهام</span><b id="task-count">0</b>
      </button>
      <button class="dock-button dock-primary" id="build-button" type="button">
        <span class="dock-symbol">＋</span><span>البناء</span>
      </button>
      <button class="dock-button" id="journal-button" type="button">
        <span class="dock-symbol">⌑</span><span>السجل</span>
      </button>
    </div>

    <div id="joystick" class="joystick" aria-label="عصا الحركة">
      <span class="joystick-knob"></span>
    </div>

    <div id="build-bar" class="build-bar hidden">
      <div class="build-bar-copy"><strong id="build-item-name">وضع البناء</strong><small id="build-hint">اضغط على الأرض لاختيار المكان</small></div>
      <button id="rotate-build" class="small-action" type="button" aria-label="تدوير">↻ تدوير</button>
      <button id="confirm-build" class="confirm-action" type="button" disabled>تثبيت هنا</button>
      <button id="cancel-build" class="small-action quiet-action" type="button">إلغاء</button>
    </div>

    <section id="sheet" class="sheet hidden" aria-modal="true" role="dialog" aria-labelledby="sheet-title">
      <div class="sheet-grip"></div>
      <div class="sheet-header">
        <div>
          <p class="eyebrow" id="sheet-kicker">حديقتك</p>
          <h1 id="sheet-title">المهام اليومية</h1>
        </div>
        <button id="close-sheet" class="close-button" type="button" aria-label="إغلاق">×</button>
      </div>
      <div id="sheet-content" class="sheet-content"></div>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="loading" class="loading-screen">
      <div class="loading-flower">✿</div>
      <div class="loading-title">MY GARDEN</div>
      <div class="loading-text">نجهّز حديقتك...</div>
      <div class="loading-track"><span></span></div>
    </div>
    <div id="fatal-error" class="fatal-error hidden"></div>
    <input id="restore-file" type="file" accept="application/json,.json" hidden />
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
